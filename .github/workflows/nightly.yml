# Nightly (design §12.2): the checks too slow for every push or pull request —
# differential fuzzing against the GLib oracle, longer fuzzing of the fixer,
# the checker, the keyfile reader and the load-set model, mutation testing of
# the core packages, the upstream example files of every tag, and the
# end-to-end suite on every image-verified mydumper version. Each check is its own job, so one failure
# does not hide the others; a failing fuzz job uploads its crashing corpus
# entries (testdata/fuzz/) so they can be copied back into the tree and fixed
# under test, per Go's usual fuzzing workflow.
#
# Hardening as in ci.yml: every action is pinned by commit SHA (Dependabot
# keeps the pins and their version comments current), the token has no
# permission unless a job asks for one, and checkouts do not keep the token
# in .git/config.
name: Nightly

on:
  schedule:
    - cron: "37 1 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  oracle-diff:
    name: oracle differential fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # mk/oracle.mk: builds the oracle images, checks conformance, then runs
      # the emulators against every GLib flavor for a full ORACLE_FUZZTIME.
      - name: Run oracle-diff
        run: make oracle-diff

      - name: Upload fuzz crashers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oracle-diff-fuzz-crashers
          path: |
            internal/oracletest/testdata/fuzz/
            internal/goption/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14

  fuzz-lint:
    name: fuzz (internal/lint, internal/model)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: FuzzFix (10m)
        run: go test ./internal/lint/ -run '^$' -fuzz '^FuzzFix$' -fuzztime 10m

      - name: FuzzCheck (10m)
        run: go test ./internal/lint/ -run '^$' -fuzz '^FuzzCheck$' -fuzztime 10m

      - name: FuzzBuildSet (5m)
        run: go test ./internal/model/ -run '^$' -fuzz '^FuzzBuildSet$' -fuzztime 5m

      - name: Upload fuzz crashers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lint-fuzz-crashers
          path: |
            internal/lint/testdata/fuzz/
            internal/model/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14

  mutation:
    name: mutation testing (core packages)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # mk/slow.mk: gremlins at a pinned version, with the blocking efficacy
      # threshold of design §11.9 (MUTATION_EFFICACY).
      - name: Run gremlins
        run: make mutation

  upstream-examples:
    name: upstream example files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # design §11.7: every tag's example files lint with no error against
      # their own version. Downloaded at test time (they are GPL-3.0).
      - name: Lint the upstream example files
        run: make integration

  fuzz-keyfile:
    name: fuzz (internal/keyfile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: FuzzNoUnknownCause (5m)
        run: go test ./internal/keyfile/ -run '^$' -fuzz '^FuzzNoUnknownCause$' -fuzztime 5m

      - name: FuzzRecoverAlwaysLoads (5m)
        run: go test ./internal/keyfile/ -run '^$' -fuzz '^FuzzRecoverAlwaysLoads$' -fuzztime 5m

      - name: Upload fuzz crashers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: keyfile-fuzz-crashers
          path: internal/keyfile/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14

  e2e-all:
    name: e2e (every image-verified version)
    runs-on: ubuntu-latest
    # make e2e-all sets E2E_GO_TIMEOUT=240m; the extra margin covers pulling
    # roughly thirty images, MySQL start-up and teardown.
    timeout-minutes: 260
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Start MySQL
        run: make e2e-up

      - name: Run the end-to-end suite on every image-verified version
        run: make e2e-all

      - name: Summarize
        if: always()
        run: |
          if [[ -f e2e/.out/summary.md ]]; then
            cat e2e/.out/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No summary: the suite did not start (see the logs above)." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-all-logs
          path: |
            e2e/.out/summary.md
            e2e/.out/logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop MySQL
        if: always()
        run: make e2e-down
