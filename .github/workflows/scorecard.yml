# OpenSSF Scorecard supply-chain checks (design §12.2). Results are uploaded to
# code scanning and, for a public repository, published to the OpenSSF API that
# serves the Scorecard badge.
#
# Publishing only works if this workflow keeps to Scorecard's restrictions: no
# workflow-level env, defaults or write permissions; in the analysis job, no env,
# defaults, containers or services, an Ubuntu runner, no run: steps, and only
# these actions: actions/checkout, actions/upload-artifact,
# github/codeql-action/upload-sarif, ossf/scorecard-action and
# step-security/harden-runner.
name: Scorecard

on:
  push:
    branches: [main] # Scorecard supports the default branch only
  schedule:
    - cron: "41 5 * * 1" # Mondays 05:41 UTC

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # upload the results to code scanning
      id-token: write # sign the results published to the OpenSSF API
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Ignored (forced off) while the repository is private.
          publish_results: true

      - name: Upload the SARIF file
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
