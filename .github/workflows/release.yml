# Release (design §12.3): release-please turns conventional commits on main
# into a release pull request; merging it tags the release and creates the
# GitHub release. This workflow then checks out that tag and runs goreleaser:
# archives, checksums, SPDX SBOMs, cosign keyless signatures, the multi-arch
# ghcr.io image and build provenance attestations.
#
# Hardening as in ci.yml: every action is pinned by commit SHA (Dependabot
# keeps the pins and their version comments current), the token has no
# permission unless a job asks for one, and checkouts do not keep the token
# in .git/config.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      vscode_tag:
        description: "Publish the VS Code packages of this existing release (v0.1.0…) instead of releasing: when a store was not ready, or after a fix to publishing"
        required: false
        default: ""

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: inputs.vscode_tag == ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  goreleaser:
    name: goreleaser
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # upload archives to the release release-please created
      packages: write # push the image to ghcr.io
      id-token: write # cosign keyless signing, build provenance attestations
      attestations: write # publish build provenance attestations
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # @vscode/vsce needs Node 22 or later.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # One VS Code package per platform, each with the executable of this
      # release's archive for it, and a universal one without executable
      # (design §14, M6; editors/vscode/scripts/package-release.sh).
      - name: Package the VS Code extension
        run: |
          npm ci --prefix editors/vscode --no-audit --no-fund
          editors/vscode/scripts/package-release.sh dist dist/vscode

      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/mydumper-lint_*.tar.gz
            dist/mydumper-lint_*.zip
            dist/checksums.txt
            dist/vscode/*.vsix

      - name: Attach the VS Code packages to the release
        run: gh release upload "$TAG" dist/vscode/*.vsix --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}

  # Publishing the extension. Both stores trust this workflow through OIDC
  # ("trusted publishing": no token is stored), when it runs in the
  # `marketplace` environment, whose required reviewer approves each release.
  # Nothing is published until the repository variable VSCODE_PUBLISH is
  # "true": set it once the stores and the environment are configured
  # (CONTRIBUTING.md, "Releasing").
  #
  # The packages come from the GitHub release, verified against their build
  # provenance attestation; vsce and ovsx come from this run's commit, so that
  # a fix to publishing also applies to an earlier release: run the workflow
  # with vscode_tag. --skip-duplicate skips the packages already published.
  marketplace:
    name: publish to the Visual Studio Marketplace
    needs: [release-please, goreleaser] # the tag, and the packages
    # After a release, or for the release a manual run names.
    if: ${{ !cancelled() && vars.VSCODE_PUBLISH == 'true' && (needs.goreleaser.result == 'success' || inputs.vscode_tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: marketplace
    permissions:
      contents: read
      id-token: write # exchanged for a short-lived Marketplace credential
      attestations: read # verify the packages' provenance
    steps:
      # This run's commit: package-lock.json pins vsce and ovsx.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download and verify the VS Code packages
        run: |
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a release tag: '$TAG'" >&2
            exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.vsix' --dir dist/vscode
          for vsix in dist/vscode/*.vsix; do
            gh attestation verify "$vsix" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.vscode_tag || needs.release-please.outputs.tag_name }}

      # vsce at the version package-lock.json pins.
      - name: Publish
        run: |
          npm ci --prefix editors/vscode --no-audit --no-fund
          editors/vscode/node_modules/.bin/vsce publish --oidc --skip-duplicate --packagePath dist/vscode/*.vsix

  open-vsx:
    name: publish to Open VSX
    needs: [release-please, goreleaser] # the tag, and the packages
    # After a release, or for the release a manual run names.
    if: ${{ !cancelled() && vars.VSCODE_PUBLISH == 'true' && (needs.goreleaser.result == 'success' || inputs.vscode_tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: marketplace
    permissions:
      contents: read
      id-token: write # exchanged for a short-lived Open VSX token
      attestations: read # verify the packages' provenance
    steps:
      # This run's commit: package-lock.json pins vsce and ovsx.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download and verify the VS Code packages
        run: |
          if [[ ! $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "not a release tag: '$TAG'" >&2
            exit 1
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.vsix' --dir dist/vscode
          for vsix in dist/vscode/*.vsix; do
            gh attestation verify "$vsix" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml"
          done
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.vscode_tag || needs.release-please.outputs.tag_name }}

      # ovsx at the version package-lock.json pins.
      - name: Publish
        run: |
          npm ci --prefix editors/vscode --no-audit --no-fund
          editors/vscode/node_modules/.bin/ovsx publish --trusted-publishing --skip-duplicate --packagePath dist/vscode/*.vsix
