# GoReleaser configuration (design §12.3): static Go binaries for Linux, macOS
# and Windows on amd64 and arm64, tar.gz/zip archives, checksums, SPDX SBOMs,
# cosign keyless signatures and a multi-arch ghcr.io image built from the
# Dockerfile at the repository root.
#
# release-please (.github/workflows/release.yml) owns the changelog and the
# version tag; this file never generates one. `make release-check` validates
# this file (goreleaser check) and `make snapshot` builds a local dry run
# (goreleaser release --snapshot --clean, output in dist/).
version: 2

project_name: mydumper-lint

builds:
  - id: mydumper-lint
    main: ./cmd/mydumper-lint
    binary: mydumper-lint
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on arm64 is not a target platform for a server-side lint tool;
      # dropping it keeps the release matrix and the Docker build simple.
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    # CommitDate (not the wall-clock build date) keeps the binary reproducible
    # across rebuilds of the same commit.
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X github.com/tomsihap/mydumper-lint/internal/buildinfo.Version={{ .Version }}
      - -X github.com/tomsihap/mydumper-lint/internal/buildinfo.Commit={{ .FullCommit }}
      - -X github.com/tomsihap/mydumper-lint/internal/buildinfo.Date={{ .CommitDate }}

archives:
  - id: default
    ids:
      - mydumper-lint
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - NOTICE
      - README.md

# One flat checksums.txt (sha256, `sha256sum -c` format) covering every
# archive and SBOM: action.yml and the pre-commit hooks verify against it by
# this exact name.
checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# SBOM per archive (design §12.3: "SBOM (SPDX)"), generated by syft.
sboms:
  - id: archive
    artifacts: archive
    documents:
      - "${artifact}.spdx.json"
    cmd: syft
    args: ["$artifact", "--output", "spdx-json=$document"]

# Keyless cosign signing of the checksums file: signs everything it lists
# (archives and SBOMs) without a per-artifact signature. Verify with:
#   cosign verify-blob --certificate-identity-regexp 'https://github.com/tomsihap/mydumper-lint/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --bundle checksums.txt.sigstore.json checksums.txt
signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes
    artifacts: checksum
    output: true

# Multi-arch image, built FROM scratch (see ./Dockerfile) from the binary this
# same run already produced — the Dockerfile never invokes `go build`.
dockers:
  - id: mydumper-lint-linux-amd64
    ids:
      - mydumper-lint
    goos: linux
    goarch: amd64
    dockerfile: Dockerfile
    use: buildx
    image_templates:
      - "ghcr.io/tomsihap/mydumper-lint:{{ .Version }}-amd64"
      - "ghcr.io/tomsihap/mydumper-lint:latest-amd64"
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.created={{ .CommitDate }}

  - id: mydumper-lint-linux-arm64
    ids:
      - mydumper-lint
    goos: linux
    goarch: arm64
    dockerfile: Dockerfile
    use: buildx
    image_templates:
      - "ghcr.io/tomsihap/mydumper-lint:{{ .Version }}-arm64"
      - "ghcr.io/tomsihap/mydumper-lint:latest-arm64"
    build_flag_templates:
      - --platform=linux/arm64
      - --label=org.opencontainers.image.version={{ .Version }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.created={{ .CommitDate }}

docker_manifests:
  - name_template: "ghcr.io/tomsihap/mydumper-lint:{{ .Version }}"
    image_templates:
      - "ghcr.io/tomsihap/mydumper-lint:{{ .Version }}-amd64"
      - "ghcr.io/tomsihap/mydumper-lint:{{ .Version }}-arm64"
  - name_template: "ghcr.io/tomsihap/mydumper-lint:latest"
    image_templates:
      - "ghcr.io/tomsihap/mydumper-lint:latest-amd64"
      - "ghcr.io/tomsihap/mydumper-lint:latest-arm64"

# release-please writes CHANGELOG.md from conventional commits; goreleaser
# does not generate one.
changelog:
  disable: true

release:
  # release-please already created the (non-draft) GitHub release and wrote
  # its notes when it tagged the version. GoReleaser finds that release by
  # tag and only uploads artifacts to it; "keep-existing" (the default) never
  # overwrites the release-please body with its own (disabled) changelog.
  mode: keep-existing
